services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: duebetter
      POSTGRES_USER: duebetter
      POSTGRES_PASSWORD: duebetter

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U duebetter -d duebetter
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://duebetter:duebetter@db:5432/duebetter

      SESSION_COOKIE_NAME: duebetter_session
      SESSION_LIFETIME_DAYS: "30"
      SECURE_COOKIES: "false"

      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: